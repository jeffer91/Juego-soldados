<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14213D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="RBTwar - estrategia ligera de robots por pelotones para celular." />
  <link rel="icon" href="favicon.svg?v=23" type="image/svg+xml" />
  <title>RBTwar</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="menu-v8.css" />
  <link rel="stylesheet" href="v10.css" />
  <link rel="stylesheet" href="v11.css" />
  <link rel="stylesheet" href="v12.css" />
  <link rel="stylesheet" href="v13.css" />
  <link rel="stylesheet" href="v14.css?v=23" />
  <link rel="stylesheet" href="v17.css?v=23" />
</head>
<body data-biome="desert">
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">R</span>
        <div class="brand-copy">
          <strong>RBTwar</strong>
          <small id="worldLabel">Desierto · Nivel 1</small>
        </div>
      </div>
      <div class="hud">
        <div class="hud-chip" aria-label="Monedas"><span>🪙</span><b id="coinCount">0</b></div>
        <div class="hud-chip" aria-label="Estrellas"><span>⭐</span><b id="starCount">0</b></div>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Silenciar sonido">🔊</button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pausar">Ⅱ</button>
      </div>
    </header>

    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Campo de batalla de RBTwar"></canvas>

      <div id="tutorial" class="tutorial hidden">
        <span>☝️ Arrastra tus robots → 🏰 CORE rojo</span>
        <button id="tutorialClose" type="button">OK</button>
      </div>

      <div id="selectionPanel" class="selection-panel hidden">
        <div><strong id="selectedSquadLabel">BAS · 5</strong></div>
        <span id="selectedSquadType">Nv.1</span>
        <button id="cancelSelection" type="button" aria-label="Cerrar selección">×</button>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <section id="startScreen" class="start-screen" aria-modal="true" role="dialog">
        <div class="start-card">
          <div class="start-hero">
            <div class="start-logo-wrap">
              <div class="start-logo">R</div>
              <span class="logo-glow"></span>
            </div>
            <div class="start-copy"><h1>RBTwar</h1></div>
            <div class="start-meta">
              <span class="meta-chip"><b id="startProgress">Nv. 1</b><small>NIVEL</small></span>
              <span class="meta-chip coin"><b id="startCoins">0</b><small>MONEDAS</small></span>
            </div>
          </div>

          <nav class="start-tabs" aria-label="Menú principal">
            <button id="campaignTab" class="start-tab active" type="button">NIVELES</button>
            <button id="upgradesTab" class="start-tab" type="button">MEJORAS</button>
          </nav>

          <section id="campaignPanel" class="start-panel campaign-panel">
            <div class="level-map">
              <div class="level-map-head"><strong id="selectedLevelInfo">Nivel 1 · Tres caminos</strong></div>
              <div id="levelPath" class="level-path" aria-label="Selección de niveles"></div>
            </div>

            <div class="campaign-footer">
              <div class="campaign-summary">
                <div class="zone-badge"><small>ZONA</small><strong id="campaignZone">Desierto</strong></div>
                <div class="army-badge"><small>UNIDADES</small><strong id="campaignUnits">BAS</strong></div>
                <div class="campaign-progress"><span><i id="campaignProgressFill"></i></span><small>CICLO</small></div>
              </div>
              <button id="startBtn" class="start-button" type="button">JUGAR</button>
            </div>
          </section>

          <section id="upgradesPanel" class="start-panel upgrades-panel hidden">
            <div class="upgrade-head">
              <strong>MEJORAS</strong>
              <div class="upgrade-wallet">🪙 <b id="upgradeCoins">0</b></div>
            </div>
            <div id="upgradeGrid" class="upgrade-grid" aria-label="Mejoras de unidades"></div>
            <div id="upgradeStatus" class="upgrade-status"></div>
          </section>
        </div>
      </section>

      <section id="resultModal" class="modal hidden" aria-modal="true" role="dialog">
        <div class="modal-card">
          <small id="resultEyebrow">VICTORIA</small>
          <h1 id="resultTitle">Nivel completado</h1>
          <div id="resultStars" class="result-stars">⭐</div>
          <p id="resultMessage"></p>
          <div class="reward"><span>🪙</span><strong id="rewardCoins">+0</strong></div>
          <div class="modal-actions">
            <button id="replayBtn" class="secondary" type="button">↻ Repetir</button>
            <button id="nextBtn" class="primary" type="button">Siguiente →</button>
          </div>
        </div>
      </section>

      <section id="pauseModal" class="modal hidden" aria-modal="true" role="dialog">
        <div class="modal-card compact">
          <h2>PAUSA</h2>
          <div class="modal-actions vertical">
            <button id="resumeBtn" class="primary" type="button">▶ Continuar</button>
            <button id="restartBtn" class="secondary" type="button">↻ Reiniciar</button>
            <button id="homeBtn" class="secondary" type="button">⌂ Inicio</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottombar">
      <button id="prevLevelBtn" type="button" aria-label="Nivel anterior">‹</button>
      <div class="level-progress"><strong id="levelProgressText">Nivel 1</strong></div>
      <button id="nextUnlockedBtn" type="button" aria-label="Siguiente nivel desbloqueado">›</button>
    </footer>
  </div>

  <div class="rotate-overlay" aria-hidden="true">
    <div class="phone-icon">↻</div>
    <strong>Gira el celular</strong>
    <span>RBTwar se juega en horizontal.</span>
  </div>

  <!-- Restaurado al motor estable v21. El v22 se retiró porque bloqueaba el arranque. -->
  <script src="src/loader-v21.js?v=23" defer></script>
  <script src="src/menu-v8.js?v=23" defer></script>
  <script src="src/menu-v12.js?v=23" defer></script>
  <script src="src/audio-v10.js?v=23" defer></script>
  <script src="src/ui-v14.js?v=23" defer></script>
</body>
</html>
