<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07101a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="RBTwar - estrategia ligera de robots por pelotones para celular." />
  <title>RBTwar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">R</span>
        <div class="brand-copy">
          <strong>RBTwar</strong>
          <small id="worldLabel">Desierto · Mapa 1</small>
        </div>
      </div>
      <div class="hud">
        <div class="hud-chip" aria-label="Monedas"><span>🪙</span><b id="coinCount">0</b></div>
        <div class="hud-chip" aria-label="Estrellas"><span>⭐</span><b id="starCount">0</b></div>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pausar">Ⅱ</button>
      </div>
    </header>

    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Campo de batalla de RBTwar"></canvas>

      <div id="tutorial" class="tutorial">
        <span><b>1</b> Toca un pelotón azul</span>
        <span><b>2</b> Toca una base</span>
        <span><b>3</b> Destruye el CORE rojo</span>
        <button id="tutorialClose" type="button">Listo</button>
      </div>

      <div id="selectionPanel" class="selection-panel hidden">
        <div>
          <small>PELOTÓN SELECCIONADO</small>
          <strong id="selectedSquadLabel">5 robots</strong>
        </div>
        <span id="selectedSquadType">Básico Nv. 1</span>
        <button id="cancelSelection" type="button">Cancelar</button>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <section id="resultModal" class="modal hidden" aria-modal="true" role="dialog">
        <div class="modal-card">
          <small id="resultEyebrow">VICTORIA</small>
          <h1 id="resultTitle">Mapa completado</h1>
          <div id="resultStars" class="result-stars">⭐</div>
          <p id="resultMessage"></p>
          <div class="reward"><span>Recompensa</span><strong id="rewardCoins">+0 🪙</strong></div>
          <div class="modal-actions">
            <button id="replayBtn" class="secondary" type="button">Repetir</button>
            <button id="nextBtn" class="primary" type="button">Siguiente</button>
          </div>
        </div>
      </section>

      <section id="pauseModal" class="modal hidden" aria-modal="true" role="dialog">
        <div class="modal-card compact">
          <small>PAUSA</small>
          <h2>RBTwar</h2>
          <p>La batalla está detenida.</p>
          <div class="modal-actions vertical">
            <button id="resumeBtn" class="primary" type="button">Continuar</button>
            <button id="restartBtn" class="secondary" type="button">Reiniciar mapa</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottombar">
      <button id="prevLevelBtn" type="button" aria-label="Mapa anterior">←</button>
      <div class="level-progress">
        <small>PROGRESO</small>
        <strong id="levelProgressText">Mapa 1</strong>
      </div>
      <button id="nextUnlockedBtn" type="button" aria-label="Siguiente mapa desbloqueado">→</button>
    </footer>
  </div>

  <div class="rotate-overlay" aria-hidden="true">
    <div class="phone-icon">↻</div>
    <strong>Gira el celular</strong>
    <span>RBTwar se juega en horizontal.</span>
  </div>

  <script src="src/game.js" defer></script>
</body>
</html>
